# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter (pinned)
        run: |
          set -euo pipefail
          FLVER=3.47.9
          ARCH=stable/linux/flutter_linux_${FLVER}-stable.tar.xz
          URL="https://storage.googleapis.com/flutter_infra_release/releases/${ARCH}"
          curl -fsSL "$URL" -o flutter.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Pub get
        run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages apps tool
      - name: Analyze
        run: |
          flutter analyze --fatal-infos packages/robot_protocol packages/robot_sim packages/robot_server
          cd apps/operator_app && flutter analyze --fatal-infos
      - name: Dart tests
        run: |
          dart test packages/robot_protocol
          dart test packages/robot_sim
          dart test packages/robot_server
      - name: Parity (criterion 13)
        run: |
          dart compile js -O2 tool/parity_js.dart -o parity_js.mjs
          node parity_js.mjs > parity_js.txt
          dart run tool/parity_compare.dart parity_vm.txt parity_js.txt
      - name: NOTICE check
        run: dart run tool/notice_check.dart

  mutants:
    needs: dart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter (pinned)
        run: |
          set -euo pipefail
          FLVER=3.47.9
          ARCH=stable/linux/flutter_linux_${FLVER}-stable.tar.xz
          URL="https://storage.googleapis.com/flutter_infra_release/releases/${ARCH}"
          curl -fsSL "$URL" -o flutter.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Mutation tests
        run: |
          dart pub get
          bash tool/mutants.sh

  flutter:
    needs: dart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter (pinned)
        run: |
          set -euo pipefail
          FLVER=3.47.9
          ARCH=stable/linux/flutter_linux_${FLVER}-stable.tar.xz
          URL="https://storage.googleapis.com/flutter_infra_release/releases/${ARCH}"
          curl -fsSL "$URL" -o flutter.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter test
        run: |
          dart pub get
          cd apps/operator_app && flutter test
      - name: Build web
        run: |
          cd apps/operator_app
          flutter build web --release --no-web-resources-cdn --base-href /flutter-robot-operator/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/operator_app/build/web

  e2e:
    needs: flutter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web-dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Playwright e2e
        run: |
          mkdir -p apps/operator_app/build/web
          cp -r web-dist/* apps/operator_app/build/web/
          cd apps/operator_app/e2e
          npm ci
          npx playwright install chromium --with-deps
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/operator_app/e2e/playwright-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screenshot
          path: docs/demo.png

  android:
    needs: dart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter (pinned)
        run: |
          set -euo pipefail
          FLVER=3.47.9
          ARCH=stable/linux/flutter_linux_${FLVER}-stable.tar.xz
          URL="https://storage.googleapis.com/flutter_infra_release/releases/${ARCH}"
          curl -fsSL "$URL" -o flutter.tar.xz
          echo "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$HOME"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
            ${{ runner.tool_cache }}/flutter/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Build APK
        run: |
          dart pub get
          cd apps/operator_app && flutter build apk --debug
